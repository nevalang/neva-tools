name: Release Neva LSP

on:
  push:
    tags:
      - 'neva-lsp/v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            output: neva-lsp-darwin-amd64
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            output: neva-lsp-darwin-arm64
          - name: linux-amd64
            goos: linux
            goarch: amd64
            output: neva-lsp-linux-amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
            output: neva-lsp-linux-arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
            output: neva-lsp-windows-amd64.exe
          - name: windows-arm64
            goos: windows
            goarch: arm64
            output: neva-lsp-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build release binary
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
            go build -ldflags='-s -w' -o "release/${{ matrix.target.output }}" ./cmd/neva-lsp

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.output }}
          path: release/${{ matrix.target.output }}
          if-no-files-found: error

  publish:
    name: Publish Neva LSP release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: sha256sum neva-lsp-* > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Neva LSP ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
