name: Release View

on:
  push:
    tags:
      - 'view/v*'

permissions:
  contents: write

jobs:
  build-ui:
    name: Build embedded UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the embedded browser UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: view-assets
          path: cmd/neva-view/assets
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target.name }}
    needs: build-ui
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            output: neva-view-darwin-amd64
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            output: neva-view-darwin-arm64
          - name: linux-amd64
            goos: linux
            goarch: amd64
            output: neva-view-linux-amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
            output: neva-view-linux-arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
            output: neva-view-windows-amd64.exe
          - name: windows-arm64
            goos: windows
            goarch: arm64
            output: neva-view-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: view-assets
          path: cmd/neva-view/assets

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build release binary
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
            go build -ldflags='-s -w' -o "release/${{ matrix.target.output }}" ./cmd/neva-view

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.output }}
          path: release/${{ matrix.target.output }}
          if-no-files-found: error

  publish:
    name: Publish View release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Read release version
        id: version
        run: echo "value=${GITHUB_REF_NAME##*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: sha256sum neva-view-* > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: View ${{ steps.version.outputs.value }}
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: release/*
